<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyPaint - Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/frontend/css/checkout.css" />
  <script type="module" src="/frontend/js/checkout.js"></script>
</head>
<body>
  <!-- Navbar simple para volver al catalogo -->
  <nav class="navbar">
    <a href="/frontend/pages/CatalogoCliente.html" class="nav-logo">Body<span>Paint</span></a>

    <div class="nav-actions">
      <a class="btn-outline" href="/frontend/pages/CatalogoCliente.html">Volver al catalogo</a>
    </div>
  </nav>

  <!-- Hero de la pantalla final de compra -->
  <section class="checkout-hero">
    <div class="checkout-hero-overlay"></div>
    <div class="checkout-hero-content">
      <p class="hero-eyebrow">Checkout</p>
      <h1 class="hero-title">Resumen de compra</h1>
      <p class="hero-sub">Revisa los productos del carrito y finaliza el pago en efectivo.</p>
    </div>
  </section>

  <!-- Layout principal con lista de productos y resumen lateral -->
  <main class="container checkout-layout">
    <section class="checkout-main">
      <div class="section-card">
        <div class="section-heading">
          <div>
            <p class="section-eyebrow" id="order-number"></p>
            <h2 class="section-title">Productos seleccionados</h2>
          </div>
        </div>

        <div class="checkout-items" id="checkout-items"></div>
      </div>
    </section>

    <aside class="checkout-sidebar">
      <div class="summary-card">
        <p class="summary-eyebrow">Confirmar compra</p>
        <h2 class="summary-title">Pago en efectivo</h2>

        <div class="summary-row">
          <span>Productos</span>
          <strong id="summary-items">0</strong>
        </div>

        <div class="summary-row">
          <span>Total a pagar</span>
          <strong id="summary-total">$0</strong>
        </div>

        <button class="btn-solid summary-button" id="cash-payment-btn" type="button">
          Pagar en efectivo
        </button>

        <a class="btn-outline summary-link" href="/frontend/pages/CatalogoCliente.html">
          Seguir comprando
        </a>
      </div>
    </aside>
  </main>

  <!-- Modal de confirmacion para el pago en efectivo -->
  <div class="payment-overlay" id="payment-overlay" role="dialog" aria-modal="true" hidden>
    <div class="payment-modal">
      <p class="payment-eyebrow">Pago</p>
      <h2 class="payment-title" id="payment-title">Monto a pagar: $0</h2>

      <div class="payment-actions">
        <button class="btn-outline" id="payment-cancel-btn" type="button">Cancelar</button>
        <button class="btn-solid" id="payment-finish-btn" type="button">Pago finalizado</button>
      </div>
    </div>
  </div>
</body>
</html>
