<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyPaint - Catalogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/frontend/css/catalogo.css" />
  <script type="module" src="/frontend/js/catalogo.js"></script>
</head>
<body>
  <!-- Navbar principal con acceso al carrito flotante -->
  <nav class="navbar">
    <a href="#" class="nav-logo">Body<span>Paint</span></a>

    <ul class="nav-links">
      <li><a href="#">Inicio</a></li>
      <li><a href="#" class="active">Cat&aacute;logo</a></li>
      <li><a href="/frontend/pages/Admin.html">Admin</a></li>
      <li><a href="/frontend/pages/VendedorPedidos.html">Vendedor</a></li>
    </ul>

      <div class="cart-anchor">
        <button
          class="cart-toggle"
          id="cart-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="cart-panel"
        >
          <span class="cart-toggle-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="20" r="1"></circle>
              <circle cx="17" cy="20" r="1"></circle>
              <path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.76L21 7H7"></path>
            </svg>
          </span>
          <span class="cart-toggle-label">Carrito</span>
          <span class="cart-count" id="cart-count">0</span>
        </button>

        <aside
          class="cart-panel"
          id="cart-panel"
          aria-hidden="true"
          aria-labelledby="cart-panel-title"
          hidden
        >
          <div class="cart-panel-header">
            <h2 class="cart-panel-title" id="cart-panel-title">Tu carrito</h2>
            <button class="cart-close" id="cart-close" type="button" aria-label="Cerrar carrito">
              &times;
            </button>
          </div>

          <div class="cart-items" id="cart-items" aria-live="polite"></div>

          <div class="cart-footer">
            <div class="cart-total-row">
              <span>Total del carrito</span>
              <strong id="cart-total">$0</strong>
            </div>
            <button class="btn-solid cart-continue" id="cart-continue" type="button">
              Continuar
            </button>
          </div>
        </aside>
      </div>
    </div>

    <button class="hamburger" id="hamburger" type="button" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Hero superior del catalogo -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">NUESTROS PRODUCTOS</h1>
      <p class="hero-sub">Encontra todo lo que necesitas para tu proximo proyecto.</p>
    </div>
  </section>

  <!-- Buscador y acciones rapidas del catalogo -->
  <section class="toolbar-section">
    <div class="container toolbar-layout">
      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          id="search"
          class="search-input"
          type="text"
          placeholder="Buscar por nombre, marca o descripcion..."
          autocomplete="off"
        />
        <button id="clear-btn" class="clear-btn" type="button" title="Limpiar busqueda">
          &times;
        </button>
      </div>
    </div>
  </section>

  <!-- Grilla donde se pintan todas las tarjetas de productos -->
  <main class="container catalog-grid" id="catalog-grid"></main>

  <!-- Modal para ver el producto y elegir cuantas unidades agregar -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" hidden>
    <div class="modal" id="modal">
      <div class="modal-img-wrap">
        <img id="modal-img" src="" alt="" />
        <button class="modal-close" id="modal-close" type="button" aria-label="Cerrar detalle">
          &times;
        </button>
      </div>

      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-brand" id="modal-brand"></p>
        <p class="modal-desc" id="modal-desc"></p>

        <div class="modal-info-row">
          <span class="modal-stock" id="modal-stock"></span>
          <span class="modal-price" id="modal-price"></span>
        </div>

        <div class="modal-actions">
          <button class="btn-outline modal-cancel" id="modal-close-secondary" type="button">Cancelar</button>

          <div class="modal-add-group">
            <div class="modal-qty-stepper">
              <button class="modal-qty-btn" id="modal-qty-decrease" type="button" aria-label="Bajar cantidad">
                -
              </button>
              <input
                class="modal-qty-input"
                id="modal-qty-input"
                type="number"
                min="1"
                value="1"
                inputmode="numeric"
                aria-label="Cantidad a agregar"
              />
              <button class="modal-qty-btn" id="modal-qty-increase" type="button" aria-label="Subir cantidad">
                +
              </button>
            </div>

            <button class="btn-solid modal-add-submit" id="modal-add" type="button">
              Agregar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
