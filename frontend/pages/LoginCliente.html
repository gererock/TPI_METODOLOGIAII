    <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyPaint - Iniciar sesión</title>
  <link rel="stylesheet" href="/frontend/css/styleRegistro.css" />
</head>
<body>

  <main class="registro-container">
    <section class="registro-card">
      <h1>Iniciar sesión</h1>
      <p>Ingresá con tu cuenta para acceder al catálogo.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required />
        </div>

        <p id="login-error" class="error-message"></p>

        <button type="submit">Iniciar sesión</button>
      </form>

      <p>
        ¿No tenés cuenta?
        <a href="/frontend/pages/RegistrarCliente.html">Registrate</a>
      </p>
    </section>
  </main>

  <script src="/frontend/js/LoginClienteApi.js"></script>
</body>
</html>
