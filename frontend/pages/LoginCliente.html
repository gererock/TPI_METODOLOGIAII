<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyPaint — Iniciar sesión</title>
  <link rel="stylesheet" href="/frontend/css/bp-theme.css" />
  <style>
    .index-main {
      min-height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
      background: var(--white);
    }
    .login-wrap {
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.4s ease both;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }
    .login-logo img {
      height: 56px;
      mix-blend-mode: multiply;
    }
    .login-eyebrow {
      font-family: var(--font-display);
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--warm);
      text-align: center;
      margin-bottom: 10px;
    }
    .login-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-align: center;
      margin-bottom: 36px;
    }
    .login-error {
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: #B43C3C;
      text-align: center;
      min-height: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .login-footer a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color var(--transition);
    }
    .login-footer a:hover { color: var(--warm); }
    .login-divider {
      width: 40px; height: 1px;
      background: var(--border);
      margin: 0 auto 32px;
    }
  </style>
</head>

      <h1 class="login-title">Iniciar sesión</h1>
      <div class="login-divider"></div>

      <div class="form-card">
        <div class="form-card-body">
          <div class="form-group" style="margin-bottom:20px">
            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-input" type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
          </div>

          <div class="form-group" style="margin-bottom:8px">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-pass-wrap">
              <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="toggle-pass" id="btn-toggle-pass" aria-label="Mostrar contraseña">
                <svg id="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="17" height="17">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="ico-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="17" height="17" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

        </div>

        <div class="form-card-footer" style="justify-content:flex-end">

        </div>
      </div>
